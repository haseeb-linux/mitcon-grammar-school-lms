{% extends "base.html" %}
{% block title %}Classes - {{ campus.name }}{% endblock %}

{% block content %}
<div class="page-wrapper">
  <div class="container-fluid">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2><i class="bi bi-book-fill"></i> Classes</h2>
        <p class="text-muted">{{ campus.name }}</p>
      </div>
      <a href="{{ url_for('principal.dashboard') }}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i> Back
      </a>
    </div>

    <div class="card-panel">
      <table class="table table-hover">
        <thead>
          <tr><th>#</th><th>Class</th><th>Section</th><th>Students</th></tr>
        </thead>
        <tbody>
          {% for c in classes %}
          <tr>
            <td>{{ loop.index }}</td>
            <td>{{ c.name }}</td>
            <td>{{ c.section or '-' }}</td>
            <td>{{ c.students|length }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

  </div>
</div>
{% endblock %}
